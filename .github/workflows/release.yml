# Tag-triggered release: build the Windows exe on a public runner, attest
# its provenance, and attach it to a GitHub Release.
#
# Cutting a release is:   git tag v1.0.0 && git push origin v1.0.0
#
# The binary is built ONLY here -- never on a dev machine -- so anyone can
# verify a download came from this repo's code with:
#   gh attestation verify automaton.exe --repo bobjoe400/automaton-attack-bot

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release
  id-token: write        # sign the attestation via Sigstore
  attestations: write    # store the attestation

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: |
          uv sync --extra live
          uv run pyinstaller automaton.spec --noconfirm

      # The exe is a windowed app: a shell won't wait for it or see its
      # console-attached output, so wait explicitly and assert exit codes.
      # `match` still exercises the full corpus download on a clean runner.
      - name: Smoke test
        run: |
          $v = Start-Process -FilePath dist/automaton.exe -ArgumentList '--version' -Wait -PassThru
          if ($v.ExitCode -ne 0) { throw "--version exited $($v.ExitCode)" }
          $m = Start-Process -FilePath dist/automaton.exe -ArgumentList 'match','PUDGE' -Wait -PassThru
          if ($m.ExitCode -ne 0) { throw "match exited $($m.ExitCode)" }

      - name: Checksum
        run: |
          (Get-FileHash dist/automaton.exe -Algorithm SHA256).Hash.ToLower() + " *automaton.exe" | Out-File -Encoding ascii SHA256SUMS

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/automaton.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          dist/automaton.exe SHA256SUMS
          --title "${{ github.ref_name }}"
          --generate-notes
